[project]
name = "gpyui"
version = "0.4.0"
description = "Native Python UI controls powered by GPUI and GPUI Kit"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Polina Gregor", email = "polyxeni.gregor@gmail.com" }
]
requires-python = ">=3.12"
dependencies = []

[project.urls]
Homepage = "https://gtrefalt.github.io/gpyui/"
Documentation = "https://gtrefalt.github.io/gpyui/"
Repository = "https://github.com/gtrefalt/gpyui"
Issues = "https://github.com/gtrefalt/gpyui/issues"
Releases = "https://github.com/gtrefalt/gpyui/releases"
Changelog = "https://github.com/gtrefalt/gpyui/blob/main/CHANGELOG.md"

[tool.maturin]
module-name = "gpyui._core"
python-packages = ["gpyui"]
python-source = "src"

[tool.uv]
cache-keys = [{ file = "pyproject.toml" }, { file = "src/**/*.rs" }, { file = "src/gpyui/**/*.py" }, { file = "src/gpyui/**/*.pyi" }, { file = "Cargo.toml" }, { file = "Cargo.lock" }, { file = "rust-toolchain.toml" }]

[build-system]
requires = ["maturin==1.12.6"]
build-backend = "maturin"

[dependency-groups]
dev = [
    "lefthook==2.1.16",
    "pytest>=8,<10",
    "python-xlib>=0.33,<1",
    "ruff==0.16.10",
    "rust-just==1.58.0",
    "ty==0.0.84",
]
docs = [
    "ruff==0.16.10",
    "zensical==0.0.67",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["native: real desktop interaction (requires DISPLAY and GPYUI_NATIVE_TESTS=1)"]

[tool.ruff]
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B"]

[tool.ty.environment]
root = ["src", "examples", "tests"]
python-version = "3.12"

[tool.ty.src]
include = ["src", "examples", "scripts", "tests", "skills"]
