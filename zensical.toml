[project.theme]
variant = "modern"
custom_dir = "overrides"
language = "en"
features = [
  "content.code.copy", "content.code.annotate", "content.tabs.link",
  "navigation.tabs", "navigation.sections", "navigation.indexes",
  "navigation.instant", "navigation.instant.prefetch", "navigation.path",
  "navigation.top", "navigation.footer", "search.highlight", "toc.follow",
]

[project.theme.icon]
logo = "lucide/panels-top-left"

[project.theme.font]
text = "Inter"
code = "JetBrains Mono"

[[project.theme.palette]]
scheme = "default"
primary = "teal"
accent = "cyan"
toggle.icon = "lucide/moon"
toggle.name = "Switch to dark appearance"

[[project.theme.palette]]
scheme = "slate"
primary = "teal"
accent = "cyan"
toggle.icon = "lucide/sun"
toggle.name = "Switch to light appearance"

[project.markdown_extensions]
admonition = {}
attr_list = {}
md_in_html = {}
toc.permalink = true
pymdownx.details = {}
pymdownx.highlight.anchor_linenums = true
pymdownx.inlinehilite = {}
pymdownx.superfences.custom_fences = [
  { name = "mermaid", class = "mermaid", format = "pymdownx.superfences.fence_code_format" },
]
pymdownx.tabbed.alternate_style = true
