[package]
name = "gpyui"
version = "0.6.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/gtrefalt/gpyui"

[lib]
name = "_core"
# "cdylib" is necessary to produce a shared library for Python to import from.
crate-type = ["cdylib"]

[dependencies]
pyo3 = { version = "=0.28.2", features = ["extension-module", "abi3-py312"] }
gpui-kit = { git = "https://github.com/longbridge/gpui-kit", rev = "c1bda59e67f46266991a230ae94f749af496af2a" }
async-channel = "=2.5.0"
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.149"
chrono = { version = "=0.4.45", default-features = false, features = ["std"] }
base64 = "=0.22.1"
reqwest_client = { package = "gpui-pre-reqwest-client", version = "=0.3.8" }

[profile.dev]
debug = 0
incremental = false

[profile.test]
debug = 0
incremental = false
