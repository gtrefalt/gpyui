pre-commit:
  parallel: true
  commands:
    ruff-lint:
      glob: "*.{py,pyi}"
      run: env -u VIRTUAL_ENV UV_PROJECT_ENVIRONMENT=.venv-tools uv run --locked --only-group dev ruff check {staged_files}
    ruff-format:
      glob: "*.{py,pyi}"
      run: env -u VIRTUAL_ENV UV_PROJECT_ENVIRONMENT=.venv-tools uv run --locked --only-group dev ruff format --check {staged_files}
    ty:
      glob: "*.{py,pyi,toml,lock}"
      run: env -u VIRTUAL_ENV UV_PROJECT_ENVIRONMENT=.venv-tools uv run --locked --only-group dev ty check

pre-push:
  commands:
    python-checks:
      run: env -u VIRTUAL_ENV UV_PROJECT_ENVIRONMENT=.venv-tools uv run --locked --only-group dev just check
