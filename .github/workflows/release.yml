name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      publish:
        description: Publish an already tested GitHub release to PyPI without rebuilding
        type: boolean
        default: false
      existing_release:
        description: Published tag to reuse (run on main; blank uses the current package version)
        type: string
        default: ""

permissions:
  contents: read

concurrency:
  group: wheels-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prepare:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    outputs:
      rust: ${{ steps.config.outputs.rust }}
      maturin: ${{ steps.config.outputs.maturin }}
      version: ${{ steps.config.outputs.version }}
      builds: ${{ steps.config.outputs.builds }}
      tests: ${{ steps.config.outputs.tests }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - id: config
        run: python scripts/wheel-ci.py prepare

  build:
    name: Wheel / ${{ matrix.name }}
    needs: prepare
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare.outputs.builds) }}
    defaults:
      run:
        shell: bash
    env:
      CARGO_BUILD_JOBS: "2"
      MACOSX_DEPLOYMENT_TARGET: "12.0"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: wheel-${{ matrix.name }}
          cache-on-failure: true
      - name: Build Linux wheel against system desktop libraries
        if: runner.os == 'Linux'
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.target }}
          # Mesa uses GPUI's XCB connection. Bundling another libxcb crashes.
          manylinux: "off"
          container: quay.io/pypa/manylinux_2_28_${{ matrix.arch }}:latest
          rust-toolchain: ${{ needs.prepare.outputs.rust }}
          maturin-version: ${{ needs.prepare.outputs.maturin }}
          args: --release --locked --strip ${{ matrix.sdist }} --auditwheel skip --out dist --interpreter /opt/python/cp312-cp312/bin/python
          before-script-linux: bash scripts/wheel-build-deps.sh
      - name: Build macOS or Windows wheel
        if: runner.os != 'Linux'
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.target }}
          rust-toolchain: ${{ needs.prepare.outputs.rust }}
          maturin-version: ${{ needs.prepare.outputs.maturin }}
          args: --release --locked --strip --out dist --interpreter python
      - uses: astral-sh/setup-uv@v6
      - name: Validate wheel contents and metadata
        env:
          WHEEL_PLATFORM: ${{ matrix.platform }}
        run: |
          python scripts/wheel-ci.py check
          uvx --from twine==7.0.0 twine check --strict dist/*
      - name: Audit Linux dependencies
        if: runner.os == 'Linux'
        run: uvx --from auditwheel==6.8.2 auditwheel show dist/*.whl
      - uses: actions/upload-artifact@v4
        with:
          name: gpyui-dist-${{ matrix.name }}
          path: dist/*
          if-no-files-found: error
          retention-days: 14

  test:
    name: Installed wheel / ${{ matrix.name }} / Python ${{ matrix.python }}
    needs: [prepare, build]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare.outputs.tests) }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: astral-sh/setup-uv@v6
      - uses: actions/download-artifact@v4
        with:
          name: gpyui-dist-${{ matrix.name }}
          path: dist
      - name: Install Linux native runtime and test tools
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb xdotool imagemagick mesa-vulkan-drivers \
            libvulkan1 libfontconfig1 libfreetype6 libxcb1 libxkbcommon0 \
            libxkbcommon-x11-0 fonts-dejavu-core
      - name: Install and verify the wheel without rebuilding
        run: python scripts/wheel-ci.py install
      - name: Run Python and bridge tests
        run: python scripts/wheel-ci.py test
      - name: Select software Vulkan driver
        if: runner.os == 'Linux'
        run: |
          python - <<'PYTHON'
          import os
          from pathlib import Path
          drivers = list(Path('/usr/share/vulkan/icd.d').glob('lvp*.json'))
          assert len(drivers) == 1, drivers
          with open(os.environ['GITHUB_ENV'], 'a') as output:
              print(f'VK_DRIVER_FILES={drivers[0]}', file=output)
          PYTHON
      - name: Run Linux window interaction tests
        if: runner.os == 'Linux'
        run: scripts/test-native.sh
      - name: Run native window, state and lifecycle smoke test
        if: runner.os != 'Linux'
        run: python scripts/wheel-ci.py native
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: native-test-failure-${{ matrix.name }}-${{ matrix.python }}
          path: artifacts/
          retention-days: 7

  release:
    name: GitHub release with verified wheels
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: [prepare, build, test]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: gpyui-dist-*
          merge-multiple: true
          path: dist
      - name: Create checksums and release notes
        run: python scripts/wheel-ci.py release
      - name: Publish GitHub prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: v${{ needs.prepare.outputs.version }}
        run: |
          gh release create "$TAG" --verify-tag --draft --prerelease \
            --title "gpyui $TAG" --notes-file artifacts/release-notes.md
          gh release upload "$TAG" dist/*
          gh release edit "$TAG" --draft=false

  publish:
    name: Publish tested distributions to PyPI
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: [prepare, build, test, release]
    runs-on: ubuntu-24.04
    environment: pypi
    permissions:
      contents: read
      actions: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: gpyui-dist-*
          merge-multiple: true
          path: dist
      - uses: astral-sh/setup-uv@v6
      - name: Select PyPI-compatible distributions
        run: python scripts/wheel-ci.py pypi
      - run: uv publish --trusted-publishing always pypi-dist/*

  publish-existing:
    name: Publish a previously tested GitHub release to PyPI
    if: github.event_name == 'workflow_dispatch' && inputs.publish
    runs-on: ubuntu-24.04
    environment: pypi
    permissions:
      contents: read
      actions: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v6
      - name: Verify release tests and download checked assets
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.existing_release }}
        run: python scripts/wheel-ci.py existing-release
      - name: Select PyPI-compatible distributions
        run: python scripts/wheel-ci.py pypi
      - run: uv publish --trusted-publishing always pypi-dist/*
