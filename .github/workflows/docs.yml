name: Documentation

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    outputs:
      pages_enabled: ${{ steps.pages.outputs.enabled }}
    env:
      UV_PROJECT_ENVIRONMENT: .venv-docs
    steps:
      - name: Check GitHub Pages configuration
        id: pages
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if gh api "repos/$GH_REPO/pages" --jq .build_type > "$RUNNER_TEMP/pages-type" 2> "$RUNNER_TEMP/pages-error"; then
            if [ "$(cat "$RUNNER_TEMP/pages-type")" = workflow ]; then
              echo 'enabled=true' >> "$GITHUB_OUTPUT"
            else
              echo '::warning::Select GitHub Actions in Settings > Pages to publish the documentation.'
              echo 'enabled=false' >> "$GITHUB_OUTPUT"
            fi
          elif grep -q 'HTTP 404' "$RUNNER_TEMP/pages-error"; then
            echo '::warning::Enable GitHub Pages with the GitHub Actions source, then run this workflow again.'
            echo 'enabled=false' >> "$GITHUB_OUTPUT"
          else
            cat "$RUNNER_TEMP/pages-error" >&2
            exit 1
          fi
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked --only-group docs
      - run: uv run --locked --only-group docs python scripts/generate-docs.py --check
      - run: uv run --locked --only-group docs zensical build --strict --clean
      - run: uv run --locked --only-group docs python scripts/check-docs-site.py
      - uses: actions/upload-artifact@v4
        with:
          name: gpyui-docs
          path: site/
          retention-days: 7
      - uses: actions/upload-pages-artifact@v3
        if: steps.pages.outputs.enabled == 'true'
        with:
          path: site/

  deploy:
    if: needs.build.outputs.pages_enabled == 'true' && github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
