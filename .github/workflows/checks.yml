name: Python checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      UV_PROJECT_ENVIRONMENT: .venv-tools
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked --only-group dev
      - run: uv run --locked --only-group dev just check
      - name: Run Python tests without compiling the native extension
        env:
          PYTHONPATH: src
        run: uv run --locked --only-group dev pytest -q tests/test_controls.py tests/test_commands.py tests/test_notes.py tests/test_dynamic.py tests/test_market.py tests/test_wheel_ci.py tests/test_skills.py
